<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Pelago emblem">
  <!--
    Pelago emblem — target lock on an illegal dump site at the waterline.
    A satellite crosshair (from orbit) framing a coastline; a bold location
    pin is stabbed where land meets water — the spot the Sentinel-2
    imagery looks for. Strict brand palette: yellow + white.
  -->

  <!-- Ocean disc (white) -->
  <circle cx="120" cy="120" r="120" fill="#ffcb2e"/>
  <circle cx="120" cy="120" r="104" fill="#ffffff"/>

  <!-- Ocean swells (subtle yellow) -->
  <path d="M52 150 C66 146 80 146 94 150" fill="none" stroke="#ffcb2e" stroke-width="4" stroke-linecap="round" stroke-opacity="0.35"/>
  <path d="M64 164 C76 160 100 160 114 164" fill="none" stroke="#ffcb2e" stroke-width="4" stroke-linecap="round" stroke-opacity="0.25"/>

  <!-- Land silhouette (yellow) with jagged coast edge -->
  <path d="M28 240 L28 176 C40 168 56 166 70 172 C84 160 104 156 122 162 C138 156 158 158 170 168 C186 160 202 166 212 178 L212 240 Z"
        fill="#ffcb2e"/>
  <path d="M28 176 C40 168 56 166 70 172 C84 160 104 156 122 162 C138 156 158 158 170 168 C186 160 202 166 212 178"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Target lock: satellite crosshair (yellow, visible on the white disc) -->
  <circle cx="120" cy="120" r="104" fill="none" stroke="#ffcb2e" stroke-width="3" stroke-opacity="0.85"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#ffcb2e" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="120" y1="8" x2="120" y2="42" stroke="#ffcb2e" stroke-width="3"/>
  <line x1="120" y1="198" x2="120" y2="232" stroke="#ffcb2e" stroke-width="3"/>
  <line x1="8" y1="120" x2="42" y2="120" stroke="#ffcb2e" stroke-width="3"/>
  <line x1="198" y1="120" x2="232" y2="120" stroke="#ffcb2e" stroke-width="3"/>

  <!-- Detection marker: bold location pin at the waterline -->
  <g transform="translate(138 122)">
    <circle cx="0" cy="10" r="40" fill="none" stroke="#ffcb2e" stroke-width="3" stroke-opacity="0.4"/>
    <circle cx="0" cy="10" r="24" fill="none" stroke="#ffcb2e" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M0 -34 C16 -20 22 -8 22 4 A22 22 0 1 1 -22 4 C-22 -8 -16 -20 0 -34 Z" fill="#ffcb2e" stroke="#ffffff" stroke-width="3.5"/>
    <circle cx="0" cy="4" r="8" fill="#ffffff"/>
  </g>
</svg>