<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Pelago logo mark">
  <defs>
    <radialGradient id="ocean" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#12294d"/>
      <stop offset="60%" stop-color="#0b1c38"/>
      <stop offset="100%" stop-color="#060f24"/>
    </radialGradient>
  </defs>

  <!-- Emblem disc: the ocean viewed from orbit -->
  <circle cx="120" cy="120" r="118" fill="url(#ocean)"/>

  <!-- Satellite aperture ring (brand yellow) -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="#ffcb2e" stroke-width="7"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Scan / orbit traces -->
  <circle cx="120" cy="120" r="66" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="120" cy="120" r="66" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="3 9"/>

  <!-- Satellite (top area) -->
  <g transform="translate(120 46)">
    <rect x="-3.5" y="-4" width="7" height="8" rx="1.5" fill="#ffcb2e"/>
    <rect x="-14" y="-2.5" width="8" height="5" rx="1" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="6" y="-2.5" width="8" height="5" rx="1" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Ocean wave lines (white, subtle) -->
  <path d="M38 96 C52 90 66 90 80 96" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M48 108 C60 103 72 103 84 108" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>

  <!-- Coast / land silhouette along the bottom (white) -->
  <path d="M30 240 L30 172 C 52 156 84 152 110 164 C 132 148 168 146 198 158 C 206 161 212 166 216 174 L218 240 Z" fill="#ffffff" fill-opacity="0.94"/>
  <!-- Shoreline edge (brand yellow) -->
  <path d="M30 172 C 52 156 84 152 110 164 C 132 148 168 146 198 158 C 206 161 212 166 216 174" fill="none" stroke="#ffcb2e" stroke-width="5" stroke-linecap="round"/>

  <!-- Detection marker: echo rings + location pin at the waterline -->
  <circle cx="162" cy="148" r="20" fill="none" stroke="#ffcb2e" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="162" cy="148" r="11" fill="none" stroke="#ffcb2e" stroke-width="2.5" stroke-opacity="0.75"/>
  <g transform="translate(162 148)">
    <path d="M0 -16 C 9 -7 12 0 12 4 A 12 12 0 1 1 -12 4 C -12 0 -9 -7 0 -16 Z" fill="#ffcb2e"/>
    <circle cx="0" cy="3.5" r="4" fill="#0b1c38"/>
  </g>
</svg>