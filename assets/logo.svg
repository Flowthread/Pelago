<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="Pelago logo">
  <!-- Rounded brand tile -->
  <rect x="4" y="4" width="892" height="232" rx="56" fill="#ffcb2e"/>

  <!-- Emblem -->
  <g transform="translate(30 16) scale(0.87)">
    <!-- Ocean disc: white water, yellow coast -->
    <circle cx="120" cy="120" r="120" fill="#ffffff"/>
    <circle cx="120" cy="120" r="114" fill="#fffdf5" stroke="#e8b100" stroke-width="2"/>

    <!-- Ocean swells (yellow) -->
    <path d="M52 152 C66 148 80 148 94 152" fill="none" stroke="#ffcb2e" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M64 166 C76 162 100 162 114 166" fill="none" stroke="#ffcb2e" stroke-width="4" stroke-linecap="round" stroke-opacity="0.35"/>

    <!-- Land silhouette (yellow) with white shoreline edge -->
    <path d="M28 240 L28 176 C40 168 56 166 70 172 C84 160 104 156 122 162 C138 156 158 158 170 168 C186 160 202 166 212 178 L212 240 Z" fill="#ffcb2e"/>
    <path d="M28 176 C40 168 56 166 70 172 C84 160 104 156 122 162 C138 156 158 158 170 168 C186 160 202 166 212 178" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

    <!-- Target lock: satellite crosshair -->
    <circle cx="120" cy="120" r="108" fill="none" stroke="#ffcb2e" stroke-width="3" stroke-opacity="0.85"/>
    <circle cx="120" cy="120" r="94" fill="none" stroke="#ffcb2e" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="120" y1="6" x2="120" y2="40" stroke="#ffcb2e" stroke-width="3"/>
    <line x1="120" y1="200" x2="120" y2="234" stroke="#ffcb2e" stroke-width="3"/>
    <line x1="6" y1="120" x2="40" y2="120" stroke="#ffcb2e" stroke-width="3"/>
    <line x1="200" y1="120" x2="234" y2="120" stroke="#ffcb2e" stroke-width="3"/>

    <!-- Detection pin at the waterline -->
    <g transform="translate(146 126)">
      <circle cx="0" cy="8" r="38" fill="none" stroke="#ffcb2e" stroke-width="2.5" stroke-opacity="0.4"/>
      <circle cx="0" cy="8" r="22" fill="none" stroke="#ffcb2e" stroke-width="2.5" stroke-opacity="0.65"/>
      <path d="M0 -30 C15 -18 21 -7 21 4 A21 21 0 1 1 -21 4 C-21 -7 -15 -18 0 -30 Z" fill="#ffcb2e" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="4" r="7" fill="#ffffff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="272" y="105" font-size="86" font-weight="800" letter-spacing="4" fill="#ffffff">PELAGO</text>
    <line x1="274" y1="128" x2="700" y2="128" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <rect x="276" y="164" width="120" height="7" rx="3.5" fill="#ffffff"/>
    <text x="276" y="196" font-size="20" font-weight="700" letter-spacing="2.2" fill="#ffffff">WHAT THEY DUMP, WE FIND</text>
    <text x="276" y="220" font-size="13" font-weight="600" letter-spacing="2.4" fill="#ffffff" fill-opacity="0.88">WASTE SITE DETECTION FROM ORBIT</text>
  </g>
</svg>